modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Global slab support through named, legal Slabbed state grammar.
'''

[[mixins]]
config="slabbed.mixins.json"

[[mixins]]
config="slabbed.client.mixins.json"

[[mixins]]
config="slabbed.sable.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
# Optional. Slabbed must bake after Relatively Placed Blocks so its model pass sees (and wraps) the
# cluster model that mod installs; without the mod this entry does nothing.
[[dependencies.${mod_id}]]
modId="relativeblocks"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
