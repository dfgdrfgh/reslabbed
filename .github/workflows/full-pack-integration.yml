name: Full pack slab integration

on:
  push:
    branches: ["port/fabric-1.21.1-core-overhaul", "port/fabric-1.21.1-stored-core-cleanup"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Updated pack control and fixed clients
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
      - name: Stage the updated pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/stage-full-pack.py
      - name: Build and verify the fixed mod and client probe
        run: |
          rm -rf build/run/gameTest
          bash gradlew --no-daemon --console=plain build runGameTest writeVerticalStepRuntime
      - name: Reproduce the old overhead-block behavior
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 8m xvfb-run -a python3 tools/full-pack-client.py --control
      - name: Verify the fixed build with the same pack
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 8m xvfb-run -a python3 tools/full-pack-client.py
      - name: Save a world under the previous 0.7 build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 8m xvfb-run -a python3 tools/full-pack-client.py --phase baseline-save --world-dir build/stored-core-world
      - name: Reopen a copy under the stored-core candidate
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 8m xvfb-run -a python3 tools/full-pack-client.py --phase candidate-reopen --world-dir build/stored-core-world
      - name: Upload the tested Slabbed JAR
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: slabbed-mc1.21.1-fabric-stored-core-candidate
          path: build/libs/slabbed-0.8.0-alpha+1.21.1-fabric.jar
          if-no-files-found: error
          retention-days: 30
