name: Portable client verification runtime

on:
  push:
    branches: ["port/fabric-1.21.1-ghost-block-repro"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
      - name: Prepare production client
        run: |
          ./gradlew --no-daemon --console=plain build writeVerticalStepRuntime
          python3 tools/export-production-runtime.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: portable-client-runtime
          path: build/portable-client-runtime.tar.gz
          compression-level: 0
          retention-days: 2
