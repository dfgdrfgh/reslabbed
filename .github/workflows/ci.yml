name: Physical-cell rewrite validation
on:
  push:
    branches: ['port/fabric-1.21.1-physical-rewrite']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Server and ${{ matrix.variant }} client
    strategy:
      fail-fast: false
      matrix:
        variant: [indigo, sodium, pack, control]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
      - name: Compile and server-test the fresh implementation
        run: |
          rm -rf build/run/gameTest
          bash gradlew --no-daemon --console=plain build runGameTest writeProbeRuntime
          python3 tools/verify-test-count.py
      - name: Stage complete latest pack
        if: matrix.variant == 'pack' || matrix.variant == 'control'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/stage-full-pack.py
      - name: Production clients
        env:
          VARIANT: ${{ matrix.variant }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$VARIANT" = "indigo" ]; then
            timeout 20m xvfb-run -a python3 tools/client-runtime.py
          elif [ "$VARIANT" = "control" ]; then
            timeout 20m xvfb-run -a python3 tools/client-runtime.py --pack --control
          else
            timeout 20m xvfb-run -a python3 tools/client-runtime.py --"$VARIANT"
          fi
      - name: Upload tested production JAR
        if: matrix.variant == 'pack'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: slabbed-physical-rewrite-mc1.21.1-fabric
          path: build/libs/slabbed-0.9.2-rewrite-alpha+1.21.1-fabric.jar
          if-no-files-found: error
          retention-days: 30
