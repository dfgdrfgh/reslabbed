name: Physical-cell rewrite validation
on:
  push:
    branches: ['port/fabric-1.21.1-physical-rewrite']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: physical-rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pack-inputs:
    name: Check complete pack inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Test complete-pack source handling
        run: python3 -m unittest discover -s tools -p test_pack_source.py -v
      - name: Check exact complete-pack source availability
        id: source
        env:
          SLABBED_FULL_PACK_URL: ${{ secrets.SLABBED_FULL_PACK_URL }}
        run: python3 tools/pack_source.py
  verify:
    name: Server and ${{ matrix.variant }} client
    strategy:
      fail-fast: false
      matrix:
        variant: [indigo, sodium, lithium, optimized]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
      - name: Compile and server-test the fresh implementation
        run: |
          rm -rf build/run/gameTest
          python3 tools/server-check.py
          python3 tools/verify-test-count.py
      - name: Inspect native targets after a failed runtime check
        if: failure() && matrix.variant == 'indigo'
        run: python3 tools/inspect-native-bytecode.py net.minecraft.block.PressurePlateBlock net.minecraft.block.WeightedPressurePlateBlock net.minecraft.block.PistonBlock net.minecraft.block.entity.PistonBlockEntity net.minecraft.block.WallBlock net.minecraft.item.ArmorStandItem net.minecraft.item.AxeItem net.minecraft.block.PointedDripstoneBlock net.minecraft.block.AbstractPressurePlateBlock net.minecraft.entity.Entity#tick,baseTick,checkBlockCollision,tryCheckBlockCollision net.minecraft.world.chunk.light.ChunkBlockLightProvider net.minecraft.entity.vehicle.AbstractMinecartEntity#tick,moveOnRail,snapPositionToRail,snapPositionToRailWithOffset net.minecraft.block.CampfireBlock net.minecraft.block.entity.CampfireBlockEntity net.minecraft.block.AbstractCandleBlock net.minecraft.block.LeverBlock net.minecraft.block.TorchBlock net.minecraft.block.WallTorchBlock net.minecraft.block.DecoratedPotBlock net.minecraft.particle.ParticleUtil
      - name: Observe production client behavior after server regressions
        if: failure() && matrix.variant == 'indigo'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [ -f 'build/libs/slabbed-0.9.4-rewrite-alpha+1.21.1-fabric.jar' ]; then
            bash gradlew --no-daemon --console=plain writeProbeRuntime
            timeout 15m xvfb-run -a python3 tools/client-runtime.py
          fi
      - name: Inspect piston pose and occlusion targets
        if: always() && matrix.variant == 'indigo'
        run: python3 tools/inspect-native-bytecode.py net.minecraft.block.PistonBlock net.minecraft.block.entity.PistonBlockEntity net.minecraft.block.Block#shouldDrawSide
      - name: Production clients
        env:
          VARIANT: ${{ matrix.variant }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$VARIANT" = "indigo" ]; then
            timeout 20m xvfb-run -a python3 tools/client-runtime.py
          else
            timeout 20m xvfb-run -a python3 tools/client-runtime.py --"$VARIANT"
          fi
      - name: Upload server and Indigo tested production JAR
        if: matrix.variant == 'indigo'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: slabbed-physical-rewrite-mc1.21.1-fabric
          path: build/libs/slabbed-0.9.4-rewrite-alpha+1.21.1-fabric.jar
          if-no-files-found: error
          retention-days: 30
  compatibility:
    name: Complete pack and ${{ matrix.variant }} client
    needs: pack-inputs
    if: needs.pack-inputs.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant: [pack, control]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
      - name: Compile and server-test the fresh implementation
        run: |
          rm -rf build/run/gameTest
          python3 tools/server-check.py
          python3 tools/verify-test-count.py
      - name: Stage exact complete latest pack
        env:
          GH_TOKEN: ${{ github.token }}
          SLABBED_FULL_PACK_URL: ${{ secrets.SLABBED_FULL_PACK_URL }}
        run: python3 tools/stage-full-pack.py
      - name: Complete-pack production clients
        env:
          VARIANT: ${{ matrix.variant }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$VARIANT" = "control" ]; then
            timeout 20m xvfb-run -a python3 tools/client-runtime.py --pack --control
          else
            timeout 20m xvfb-run -a python3 tools/client-runtime.py --pack
          fi
