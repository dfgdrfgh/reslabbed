name: Slabbed CI

on:
  pull_request:
  push:
    branches:
      - "port/fabric-1.21.1-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slabbed-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and server GameTests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # This line's dev client is staged with real player mods (Sodium, Lithium, Terrain
      # Slabs, C2ME, ...) under run/mods for local testing. A jar left there must never reach
      # the canonical CI server-test environment.
      - name: Reject local runtime jars
        shell: bash
        run: |
          if [ -d run/mods ] && find run/mods -type f -name '*.jar' -print -quit | grep -q .; then
            echo "Unexpected run/mods jar would contaminate the canonical server test environment."
            exit 1
          fi

      # Finalizes with :verifyGameTestCount (build.gradle), which fails the build if the
      # reported test count differs from tools/expected-gametest-count.py — the stale-run-dir
      # false-green class is machine-gated, not a manual step.
      - name: Build and run server GameTests
        run: |
          rm -rf build/run/gameTest
          ./gradlew --no-daemon --stacktrace --console=plain build runGameTest

      - name: Verify packaged mod icon
        run: |
          python3 - <<'PYCODE'
          import json, pathlib, struct, zipfile
          jars = [p for p in pathlib.Path('build/libs').glob('*.jar')
                  if not p.name.endswith(('-sources.jar', '-dev.jar'))]
          assert len(jars) == 1, f'Expected one release jar, found {len(jars)}'
          with zipfile.ZipFile(jars[0]) as jar:
              metadata = json.loads(jar.read('fabric.mod.json'))
              icon_path = metadata['icon']
              icon = jar.read(icon_path)
              assert icon[:8] == b'\x89PNG\r\n\x1a\n', 'Mod icon is not a PNG'
              width, height = struct.unpack('>II', icon[16:24])
              assert width > 0 and height > 0, 'Mod icon has invalid dimensions'
              print(f'{jars[0].name}: {icon_path} packaged ({width}x{height})')
          PYCODE

      - name: Check vertical faces in Indigo and Sodium clients
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rm -rf build/run/vertical-step-client
          ./gradlew --no-daemon --console=plain writeVerticalStepRuntime
          timeout 10m xvfb-run -a python3 tools/vertical-step-runtime.py
          test -f build/run/vertical-step-client/vertical-step-pass.txt
          mv build/run/vertical-step-client build/vertical-step-indigo
          mkdir -p build/run/vertical-step-client/mods
          python3 - <<'PYCODE'
          import hashlib, pathlib, urllib.request
          url = 'https://cdn.modrinth.com/data/AANobbMI/versions/SMxNOGZ6/sodium-fabric-0.8.13%2Bmc1.21.1.jar'
          data = urllib.request.urlopen(url).read()
          expected = '8614a374593698069a80ac74de8cd9c28f3928d16819a0e0d6320b538e823f7e54e8be06d5ea5a9c268beb0e02073209d1f831a02dede851588b972367680853'
          assert hashlib.sha512(data).hexdigest() == expected, 'Sodium test dependency hash mismatch'
          pathlib.Path('build/run/vertical-step-client/mods/sodium.jar').write_bytes(data)
          PYCODE
          timeout 10m xvfb-run -a python3 tools/vertical-step-runtime.py
          test -f build/run/vertical-step-client/vertical-step-pass.txt

      - name: Check real Terrain Slabs compatibility in Sodium
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/run/vertical-step-client build/vertical-step-sodium
          mkdir -p build/run/vertical-step-client/mods
          cp build/vertical-step-sodium/mods/sodium.jar build/run/vertical-step-client/mods/
          gh api repos/dfgdrfgh/terrain_slabs_fork/actions/artifacts/11730260747/zip > build/terrain-slabs-fixture.zip
          python3 - <<'PYCODE'
          import hashlib, io, pathlib, urllib.request, zipfile
          data = pathlib.Path('build/terrain-slabs-fixture.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '7ee547759b235f1e7977dd41b37dea3298bd96217ddb931d8b76d9a36c4e4852'
          mods = pathlib.Path('build/run/vertical-step-client/mods')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              jars = [n for n in archive.namelist() if n.endswith('.jar') and not n.endswith(('-sources.jar', '-dev.jar'))]
              assert len(jars) == 1, jars
              (mods / 'terrain-slabs.jar').write_bytes(archive.read(jars[0]))
          data = urllib.request.urlopen('https://cdn.modrinth.com/data/lhGA9TYQ/versions/Pzc2FP5K/architectury-13.0.11-fabric.jar').read()
          assert hashlib.sha512(data).hexdigest() == '53314eb34890b11ad3c06c6f3ba2d01ae1ca756235ce4f0574e4b0544952a2ab3c628c81b521653d6487d62c5dc3055e06fed6367a3a499bafad909512f0c716'
          (mods / 'architectury.jar').write_bytes(data)
          PYCODE
          timeout 10m xvfb-run -a python3 tools/vertical-step-runtime.py
          test -f build/run/vertical-step-client/vertical-step-pass.txt

      - name: Upload vertical face checks
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: vertical-step-client-checks
          path: |
            build/vertical-step-indigo/production-launch.log
            build/vertical-step-indigo/logs/
            build/vertical-step-indigo/vertical-step*.png
            build/vertical-step-indigo/vertical-step-pass.txt
            build/vertical-step-sodium/production-launch.log
            build/vertical-step-sodium/logs/
            build/vertical-step-sodium/vertical-step*.png
            build/vertical-step-sodium/vertical-step-pass.txt
            build/run/vertical-step-client/production-launch.log
            build/run/vertical-step-client/logs/
            build/run/vertical-step-client/vertical-step*.png
            build/run/vertical-step-client/vertical-step-pass.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload gametest logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gametest-logs
          path: |
            build/run/gameTest/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Fabric release jar
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: slabbed-mc1.21.1-fabric
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 30

