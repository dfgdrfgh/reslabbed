                "SlabRigHangingCatalogTest.java",
                "SlabRigHangingPaintingPlanTest.java",
                "SlabRigHangingKernelArtifactsTest.java",
                "SlabRigHangingPaintingKernelTest.java",
                "SlabRigHangingDirectEntityGateTest.java",
                "SlabRigHangingDirectFixtureTest.java",
                "SlabRigHangingDirectActionsTest.java",
                "SlabRigHangingDirectStateStoreTest.java",
                "SlabRigHangingDirectExecutorTest.java"
        ].each { sourceName ->
            def suffix = "/com/slabbed/test/${sourceName}"
            if (!configuredSources.any { it.endsWith(suffix) }) {
                throw new GradleException("RIG catalog gametest source registration missing: ${sourceName}")
