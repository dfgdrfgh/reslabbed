plugins {
    id 'fabric-loom' version '1.17.20'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom { splitEnvironmentSourceSets() }
fabricApi { configureTests { createSourceSet = true } }
repositories { mavenCentral(); maven { url 'https://api.modrinth.com/maven' } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modClientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly 'maven.modrinth:sodium:SMxNOGZ6'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar { from('LICENSE') { rename { "LICENSE_${project.base.archivesName.get()}" } } }
sourceSets { unit { java.srcDir 'src/unit/java'; compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
tasks.register('halfGridTest', JavaExec) {
    dependsOn tasks.named('unitClasses')
    classpath = sourceSets.unit.runtimeClasspath
    mainClass = 'com.slabbed.core.HalfGridTest'
}
tasks.register('physicalPushTest', JavaExec) {
    dependsOn tasks.named('unitClasses')
    classpath = sourceSets.unit.runtimeClasspath
    mainClass = 'com.slabbed.core.PhysicalPushTest'
}
tasks.named('check') { dependsOn 'halfGridTest', 'physicalPushTest' }
tasks.register('clientProbeJar', Jar) {
    dependsOn 'gametestClasses'
    from sourceSets.gametest.output
    archiveFileName = 'physical-probe-named.jar'
    destinationDirectory = file('build/probe')
}
tasks.register('remapClientProbeJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn 'clientProbeJar'
    inputFile = tasks.named('clientProbeJar').flatMap { it.archiveFile }
    archiveFileName = 'physical-probe.jar'
    destinationDirectory = file('build/probe')
    addNestedDependencies = false
    classpath.from sourceSets.gametest.compileClasspath
}
tasks.register('writeProbeRuntime') {
    dependsOn 'remapClientProbeJar', 'downloadAssets'
    doLast {
        def artifacts = configurations.gametestRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
            [group: it.moduleVersion.id.group, name: it.moduleVersion.id.name,
             version: it.moduleVersion.id.version, classifier: it.classifier, path: it.file.absolutePath]
        }
        file('build/probe/dependencies.json').text = groovy.json.JsonOutput.toJson([
            gradleHome: gradle.gradleUserHomeDir.absolutePath, fabricVersion: project.fabric_version, artifacts: artifacts])
    }
}
