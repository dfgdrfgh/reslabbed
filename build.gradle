def slabbedGitSha = { ->
    try {
        def head = 'git rev-parse --short=10 HEAD'.execute(null, rootDir).text.trim()
        if (head.isEmpty()) {
            return 'unknown'
        }
        def dirty = 'git status --porcelain'.execute(null, rootDir).text.trim()
        return dirty.isEmpty() ? head : head + '-dirty'
    } catch (Exception ignored) {
        return 'unknown'
    }
}()
def slabbedBuildTime = java.time.Instant.now().toString()

// Every `-Dslabbed.*` on the Gradle command line is forwarded verbatim into the forked game JVM
// (client, server, gametest). A prefix match, never an allowlist (see the Fabric lines' history).
def slabbedForwardedRunPropertyArgs = { ->
    System.properties.findAll { key, value ->
        key instanceof String && value != null && key.startsWith("slabbed.")
    }.collect { key, value -> "-D${key}=${value}" }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.diagnostics

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        slabbed_gametest {
            sourceSet sourceSets.gametest
        }
        slabbed_diagnostics {
            sourceSet sourceSets.diagnostics
        }
    }

    runs {
        client {
            client()
            systemProperty "slabbed.targetDyOverlay", "true"
            systemProperty "slabbed.devGitSha", slabbedGitSha
            systemProperty "slabbed.devBuildTime", slabbedBuildTime
            jvmArguments.addAll(provider { slabbedForwardedRunPropertyArgs() })
            loadedMods = [mods."${mod_id}", mods.slabbed_diagnostics]
        }
        server {
            server()
            programArgument "--nogui"
            jvmArguments.addAll(provider { slabbedForwardedRunPropertyArgs() })
            loadedMods = [mods."${mod_id}", mods.slabbed_diagnostics]
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = gameTestDirectory
            systemProperty "neoforge.enabledGameTestNamespaces", "slabbed_gametest"
            // The gametest JVM stays at the frozen-OFF compatibility floor (design §4.1), as on the
            // Fabric lines; -Dslabbed.frozenDy=... on the gradle invocation still wins.
            jvmArguments.addAll(provider { ["-Dslabbed.frozenDy=false"] + slabbedForwardedRunPropertyArgs() })
            loadedMods = [mods."${mod_id}", mods.slabbed_gametest, mods.slabbed_diagnostics]
            taskBefore tasks.named("gametestClasses")
            taskBefore tasks.named("diagnosticsClasses")
        }
    }

}

