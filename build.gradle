        def entrypoints = (registrar =~ /"([\w.]+)"/).collect { it[1] }
        [
                "com.slabbed.test.RegistrySweepTest",
                "com.slabbed.test.SlabRigCommandSmokeTest",
                "com.slabbed.test.SlabRigCaseCatalogTest",
                "com.slabbed.test.SlabRigHangingCatalogTest",
                "com.slabbed.test.SlabRigHangingPaintingPlanTest",
                "com.slabbed.test.SlabRigHangingKernelArtifactsTest",
                "com.slabbed.test.SlabRigHangingPaintingKernelTest",
                "com.slabbed.test.SlabRigHangingDirectEntityGateTest",
                "com.slabbed.test.SlabRigHangingDirectFixtureTest",
                "com.slabbed.test.SlabRigHangingDirectActionsTest",
                "com.slabbed.test.SlabRigHangingDirectStateStoreTest",
                "com.slabbed.test.SlabRigHangingDirectExecutorTest"
        ].each { className ->
            if (!entrypoints.contains(className)) {
                throw new GradleException("RIG catalog gametest registrar entry missing: ${className}")
            }
        }
    }
}


def discretionForbiddenTokens = [
        "JUL" + "IA", "Jul" + "ia", "jul" + "ia", "jool" + "mac", "sch" + "ohl",
]
def releaseHygieneForbiddenTokens = discretionForbiddenTokens + [
        "LiveCursorIntentRecorder",
        "SlabModelStaleSentinel",
        "TargetDyOverlay",
        "SlabModelStaleSentinelClient",
        "TargetDyHudMixin",
        "CasePlacementProbeForTests",
        "CasePostUseTestHook",
        "BlockItemTestFixture",
        "TestSnapshot",
        "slabbed_diagnostics"
]

tasks.register("verifyReleaseJarHygiene") {
    group = "verification"
    description = "Fails when public binaries or sources retain diagnostic or GameTest-only seams."
    dependsOn(tasks.named("jar"), tasks.named("sourcesJar"))
    inputs.files(
            tasks.named("jar").flatMap { it.archiveFile },
            tasks.named("sourcesJar").flatMap { it.archiveFile })

    doLast {
        [
                tasks.named("jar").get().archiveFile.get().asFile,
                tasks.named("sourcesJar").get().archiveFile.get().asFile
        ].each { archive ->
            def violations = []
            def entryNames = new HashSet<String>()
            def manifestBytes = null
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.directory) {
                        entryNames.add(entry.name)
                        def bytes = zip.getInputStream(entry).readAllBytes()
                        if (entry.name == "META-INF/MANIFEST.MF") {
                            manifestBytes = bytes
                        }
                        def content = new String(
                                bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                        releaseHygieneForbiddenTokens.each { token ->
                            if (content.contains(token)) {
                                violations.add("${entry.name} -> ${token}")
                            }
                        }
                    }
                }
            }
            if (!violations.isEmpty()) {
                throw new GradleException(
                        "Release hygiene violation in ${archive.name}:\n"
                                + violations.unique().sort().join("\n"))
            }

            // Manifest honesty: an artifact must never ADVERTISE a class it does not contain.
            // Loom derives Fabric-Loom-Client-Only-Entries from the client source-set output, so
            // every unit releaseArtifactExclusions drops stays named in the manifest -- 5 of the
            // mod jar's 42 names were phantoms before pruneClientOnlyEntriesManifest. This asserts
            // the prune actually ran on the FINISHED archive: if that doLast is ever detached,
            // reordered behind this gate, or defeated by a new archive path, the build goes red
            // here instead of shipping a manifest that lies about its own contents.
            if (manifestBytes != null) {
                def manifest = new java.util.jar.Manifest(new ByteArrayInputStream(manifestBytes))
                def declared = manifest.mainAttributes.getValue("Fabric-Loom-Client-Only-Entries")
                if (declared != null && !declared.isEmpty()) {
                    def phantom = declared.split(";").findAll { !entryNames.contains(it) }
                    if (!phantom.isEmpty()) {
                        throw new GradleException(
                                "Manifest hygiene violation in ${archive.name}: "
                                        + "Fabric-Loom-Client-Only-Entries names ${phantom.size()} "
                                        + "entry/entries the archive does not contain:\n  "
                                        + phantom.sort().join("\n  "))
                    }
                }
            }
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Release artifact allowlist -- the INVERTED hygiene gate.
//
// releaseHygieneForbiddenTokens above is a DENYLIST: it can only catch names somebody thought to
// forbid. The jar/sourcesJar exclude() lists are likewise lists of things to DROP. Neither can see
// a package nobody thought about -- which is exactly how the V palette screen and /slabrig shipped
// in release/mc262-0.5.0-alpha.1 (com/slabbed/client/palette/** and com/slabbed/command/** matched
// nothing in either list).
//

// row in RELEASE_ALLOWLIST.md, and the build FAILS naming anything that does not. The denylist is
// deliberately RETAINED as an independent second layer -- see RELEASE_ALLOWLIST.md for how the two
// interact and why neither subsumes the other.
// ---------------------------------------------------------------------------------------------

def releaseAllowlistFile = rootProject.file("RELEASE_ALLOWLIST.md")

// Collapse an archive entry to a "logical unit" so ONE allowlist row covers a class, its nest
// members and its source file: Foo.class, Foo$Bar.class and Foo.java all key to ".../Foo".
// Anything that is not a class or a source keeps its literal path (META-INF/neoforge.mods.toml, assets/...).
def releaseLogicalUnit = { String entryName ->
    def name = entryName
    if (name.endsWith(".class")) {
        name = name.substring(0, name.length() - ".class".length())
        int lastSlash = name.lastIndexOf('/')
        int nest = name.indexOf('$', lastSlash + 1)
        if (nest >= 0) {
            name = name.substring(0, nest)
        }
    } else if (name.endsWith(".java")) {
        name = name.substring(0, name.length() - ".java".length())
    }
    return name
}

// pkg/**  -> that package and every subpackage, recursively (resource trees only, by policy)
// pkg/*   -> DIRECT members only; a brand-new subpackage is NOT covered. This is the palette
//            failure encoded as a rule.
// pkg/Foo -> exactly that one logical unit
def releaseAllowlistMatches = { String pattern, String unit ->
    if (pattern.endsWith("/**")) {
        return unit.startsWith(pattern.substring(0, pattern.length() - 2))
    }
    if (pattern.endsWith("/*")) {
        def prefix = pattern.substring(0, pattern.length() - 1)
        return unit.startsWith(prefix) && !unit.substring(prefix.length()).contains("/")
    }
    return unit == pattern
}

// Reads the "## Approved ..." sections of RELEASE_ALLOWLIST.md. Only table rows whose first cell is
// a backticked token count as entries, and only inside an "## Approved" section -- the explanatory
// tables elsewhere in the document are documentation, not approvals.
def parseReleaseAllowlist = { File file ->
    if (!file.exists()) {
        throw new GradleException(
                "RELEASE_ALLOWLIST.md is missing at ${file.absolutePath}.\n"
                        + "The release allowlist is mandatory. Restore it from git -- deleting it is\n"
                        + "not a way to make this gate pass.")
    }
    def approved = new LinkedHashMap<String, String>()
    boolean inApprovedSection = false
    file.eachLine("UTF-8") { rawLine ->
        def line = rawLine.trim()
        if (line.startsWith("## ")) {
            inApprovedSection = line.toLowerCase(java.util.Locale.ROOT).startsWith("## approved")
            return
        }
        if (!inApprovedSection || !line.startsWith("|")) {
            return
        }
        def cells = line.split("\\|", -1).collect { it.trim() }
        if (cells.size() < 4) {
            return
        }
        def entry = cells[1]
        def reason = cells[2]
        if (entry.length() <= 2 || !entry.startsWith("`") || !entry.endsWith("`")) {
            return
        }
        entry = entry.substring(1, entry.length() - 1).trim()
        if (entry.isEmpty()) {
            return
        }
        if (reason.replace("`", "").trim().isEmpty()) {
            throw new GradleException(
                    "RELEASE_ALLOWLIST.md entry '${entry}' has no reason.\n"
                            + "An approval with no reason is how the list rots. Give it one.")
        }
        if (approved.containsKey(entry)) {
            throw new GradleException(
                    "RELEASE_ALLOWLIST.md lists '${entry}' twice. Keep one row per entry.")
        }
        approved.put(entry, reason)
    }
    if (approved.isEmpty()) {
        throw new GradleException(
                "RELEASE_ALLOWLIST.md parsed to zero approved entries.\n"
                        + "Either the '## Approved' sections were emptied or the table format was broken.\n"
                        + "Entry rows must look like: | `com/slabbed/pkg/*` | reason |")
    }
    return approved
}

// Returns [unapproved: Map<unit, SortedSet<archiveName>>, stale: SortedSet<pattern>]
def scanReleaseArtifacts = { List<File> archives ->
    def approved = parseReleaseAllowlist(releaseAllowlistFile)
    def unapproved = new TreeMap<String, TreeSet<String>>()
    def matchedPatterns = new HashSet<String>()
    archives.each { archive ->
        if (!archive.exists()) {
            throw new GradleException(
                    "Release artifact ${archive.absolutePath} does not exist; cannot verify it.")
        }
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.directory) {
                    return
                }
                def unit = releaseLogicalUnit(entry.name)
                def hit = approved.keySet().find { pattern ->
                    releaseAllowlistMatches(pattern, unit)
                }
                if (hit != null) {
                    matchedPatterns.add(hit)
                } else {
                    unapproved.computeIfAbsent(unit, { new TreeSet<String>() }).add(archive.name)
                }
            }
        }
    }
    def stale = new TreeSet<String>(approved.keySet())
    stale.removeAll(matchedPatterns)
    return [unapproved: unapproved, stale: stale]
}

def releaseAllowlistArchives = { ->
    [
            tasks.named("jar").get().archiveFile.get().asFile,
            tasks.named("sourcesJar").get().archiveFile.get().asFile
    ]
}

tasks.register("verifyReleaseAllowlist") {
    group = "verification"
    description = "Fails naming every class or resource that reaches a release artifact without an "  +
            "approved entry in RELEASE_ALLOWLIST.md."
    dependsOn(tasks.named("jar"), tasks.named("sourcesJar"))
    inputs.files(
            tasks.named("jar").flatMap { it.archiveFile },
            tasks.named("sourcesJar").flatMap { it.archiveFile })
    inputs.file(releaseAllowlistFile)

    doLast {
        def result = scanReleaseArtifacts(releaseAllowlistArchives())

        if (!result.stale.isEmpty()) {
            logger.warn("RELEASE_ALLOWLIST.md has {} entry/entries that match nothing in either "
                    + "release artifact (stale approvals rot the list): {}",
                    result.stale.size(), result.stale.join(", "))
        }

        if (!result.unapproved.isEmpty()) {
            def detail = result.unapproved.collect { unit, archiveNames ->
                "  ${unit}\n      reached: ${archiveNames.join(', ')}"
            }.join("\n")
            throw new GradleException(
                    "Release allowlist violation: ${result.unapproved.size()} unit(s) reached a "
                            + "release artifact with no approved entry in RELEASE_ALLOWLIST.md.\n\n"
                            + detail + "\n\n"
                            + "Two legitimate responses for EACH entry above:\n"
                            + "  1. EXCLUDE it -- add exclude(\"<path>\") to BOTH the `jar` and the "
                            + "`sourcesJar` block\n"
                            + "     in build.gradle (and gate or remove whatever registers it), then rebuild.\n"
                            + "  2. APPROVE it -- add a row under an \"## Approved\" heading in "
                            + "RELEASE_ALLOWLIST.md\n"
                            + "     with a reason that would survive review. Package rows are "
                            + "`pkg/*` (direct members\n"
                            + "     only) or `pkg/**` (recursive); a bare path is a single class.\n\n"
                            + "Widening an existing pattern purely to make this green is neither. "
                            + "This gate is closed-world\n"
                            + "on purpose: anything new fails by default, because anything new used "
                            + "to SHIP by default.\n"
                            + "Run ./gradlew25 releaseAllowlistReport for the same list without "
                            + "failing the build.")
        }

        println("RELEASE_ALLOWLIST_VERIFY artifacts=${releaseAllowlistArchives().size()} "
                + "unapproved=0 stale=${result.stale.size()}")
    }
}

tasks.register("releaseAllowlistReport") {
    group = "verification"
    description = "Prints every unapproved unit in the release artifacts WITHOUT failing. Review " +
            "aid only -- it does not bypass verifyReleaseAllowlist."
    dependsOn(tasks.named("jar"), tasks.named("sourcesJar"))
    inputs.files(
            tasks.named("jar").flatMap { it.archiveFile },
            tasks.named("sourcesJar").flatMap { it.archiveFile })
    inputs.file(releaseAllowlistFile)
    outputs.file(layout.buildDirectory.file("reports/release-allowlist/unapproved.txt"))

    doLast {
        def result = scanReleaseArtifacts(releaseAllowlistArchives())
        def lines = []
        lines.add("# Units reaching a release artifact with no approved RELEASE_ALLOWLIST.md entry")
        lines.add("# unapproved=${result.unapproved.size()} stale=${result.stale.size()}")
        result.unapproved.each { unit, archiveNames ->
            lines.add("UNAPPROVED ${unit}\t${archiveNames.join(', ')}")
        }
        result.stale.each { pattern ->
            lines.add("STALE ${pattern}\t(approved but matches nothing)")
        }
        def reportFile = outputs.files.singleFile
        reportFile.parentFile.mkdirs()
        reportFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
        println(lines.join("\n"))
        println("RELEASE_ALLOWLIST_REPORT ${reportFile.absolutePath}")
    }
}


tasks.named("build") {
    dependsOn(tasks.named("verifyReleaseJarHygiene"))
    dependsOn(tasks.named("verifyReleaseAllowlist"))
}

["jar", "sourcesJar"].each { archiveTaskName ->
    tasks.named(archiveTaskName) {
        finalizedBy(tasks.named("verifyReleaseJarHygiene"), tasks.named("verifyReleaseAllowlist"))
    }
}

if (project.minecraft_version != "26.2") {
    tasks.named("compileGametestJava") {
        dependsOn(tasks.named("verifyRig2GametestRegistration"))
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }
    repositories {
    }
}
